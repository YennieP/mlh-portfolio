<!DOCTYPE HTML>
<!-- Design: Forty by HTML5 UP (html5up.net) — CC-BY 3.0. Adapted into Flask/Jinja. -->
<html>

<head>
    <title>Yanxi Pan — {{ title }}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='forty/css/main.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/yanxi-forty.css') }}" />
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon" />
    <noscript>
        <link rel="stylesheet" href="{{ url_for('static', filename='forty/css/noscript.css') }}" />
    </noscript>
</head>

<body class="is-preload">
    <div id="wrapper">

        {% include '_yanxi_header.html' %}

        <!-- Banner (compact sub-page header) -->
        <section id="banner" class="major sub">
            <div class="inner">
                <header class="major">
                    <h1>Timeline</h1>
                </header>
                <div class="content">
                    <p>Leave a post and it shows up below — a little guestbook backed by a database.</p>
                </div>
            </div>
        </section>

        <!-- Main -->
        <div id="main">

            <!-- Add a post -->
            <section id="post-form">
                <div class="inner">
                    <header class="major">
                        <h2>Add a post</h2>
                    </header>
                    <form id="timeline-form" method="post">
                        <div class="fields">
                            <div class="field half">
                                <label for="name">Name</label>
                                <input type="text" name="name" id="name" required />
                            </div>
                            <div class="field half">
                                <label for="email">Email</label>
                                <input type="email" name="email" id="email" required />
                            </div>
                            <div class="field">
                                <label for="content">Content</label>
                                <textarea name="content" id="content" rows="4" required></textarea>
                            </div>
                        </div>
                        <ul class="actions">
                            <li><input type="submit" value="Post" class="primary" /></li>
                        </ul>
                        <p id="form-status" class="timeline-status" aria-live="polite"></p>
                    </form>
                </div>
            </section>

            <!-- Posts feed -->
            <section id="posts">
                <div class="inner">
                    <header class="major">
                        <h2>Posts</h2>
                    </header>
                    <div id="posts-container"></div>
                </div>
            </section>

        </div>

        {% include '_yanxi_footer.html' %}

    </div>

    {% include '_yanxi_scripts.html' %}

    <!-- Timeline feed logic (course task): talks to /api/timeline_post -->
    <script>
        async function loadPosts() {
            const response = await fetch('/api/timeline_post');
            const data = await response.json();
            displayPosts(data.timeline_posts);
        }

        // Build each post with createElement + textContent (NOT innerHTML) so a
        // visitor's name/content/email can't inject HTML/script — this is a public form.
        function displayPosts(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            posts.forEach(function (post) {
                const emailHash = md5((post.email || '').trim().toLowerCase());
                const avatarUrl = 'https://www.gravatar.com/avatar/' + emailHash + '?d=identicon';

                const card = document.createElement('div');
                card.className = 'post';

                const head = document.createElement('div');
                head.className = 'post-header';
                const img = document.createElement('img');
                img.className = 'avatar';
                img.src = avatarUrl;
                img.alt = 'avatar';
                const nameEl = document.createElement('strong');
                nameEl.textContent = post.name;
                head.appendChild(img);
                head.appendChild(nameEl);

                const meta = document.createElement('div');
                meta.className = 'post-meta';
                meta.textContent = (post.email || '') + ' · ' + (post.created_at || '');

                const body = document.createElement('p');
                body.className = 'post-content';
                body.textContent = post.content;

                card.appendChild(head);
                card.appendChild(meta);
                card.appendChild(body);
                container.appendChild(card);
            });
        }

        // Native validation bubbles follow the browser's locale (e.g. Chinese).
        // Override them so the prompts are always in English.
        var validationMsgs = {
            name: 'Please enter your name.',
            email: 'Please enter a valid email address.',
            content: 'Please enter your message.'
        };
        Object.keys(validationMsgs).forEach(function (id) {
            var el = document.getElementById(id);
            el.addEventListener('invalid', function () { el.setCustomValidity(validationMsgs[id]); });
            el.addEventListener('input', function () { el.setCustomValidity(''); });
        });

        var formStatus = document.getElementById('form-status');
        document.getElementById('timeline-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            formStatus.textContent = '';
            formStatus.className = 'timeline-status';
            const formData = new FormData(this);
            const response = await fetch('/api/timeline_post', { method: 'POST', body: formData });
            if (response.ok) {
                this.reset();
                formStatus.textContent = 'Posted!';
                formStatus.className = 'timeline-status is-success';
                loadPosts();
            } else {
                // Show the server's (English) validation error.
                var data = {};
                try { data = await response.json(); } catch (err) {}
                formStatus.textContent = data.error || 'Something went wrong — please try again.';
                formStatus.className = 'timeline-status is-error';
            }
        });

        // MD5 for Gravatar (bonus)

,i,d[n+1],4,-1530992060),f,r,d[n+4],11,1272893353),m,f,d[n+7],16,-155497632),i,m,d[n+10],23,-1094730640),r=md5hh(r,i=md5hh(i,m=md5hh(m,f,r,i,d[n+13],4,681279174),f,r,d[n+0],11,-358537222),m,f,d[n+3],16,-722521979),i,m,d[n+6],23,76029189),r=md5hh(r,i=md5hh(i,m=md5hh(m,f,r,i,d[n+9],4,-640364487),f,r,d[n+12],11,-421815835),m,f,d[n+15],16,530742520),i,m,d[n+2],23,-995338651),r=md5ii(r,i=md5ii(i,m=md5ii(m,f,r,i,d[n+0],6,-198630844),f,r,d[n+7],10,1126891415),m,f,d[n+14],15,-1416354905),i,m,d[n+5],21,-57434055),r=md5ii(r,i=md5ii(i,m=md5ii(m,f,r,i,d[n+12],6,1700485571),f,r,d[n+3],10,-1894986606),m,f,d[n+10],15,-1051523),i,m,d[n+1],21,-2054922799),r=md5ii(r,i=md5ii(i,m=md5ii(m,f,r,i,d[n+8],6,1873313359),f,r,d[n+15],10,-30611744),m,f,d[n+6],15,-1560198380),i,m,d[n+13],21,1309151649),r=md5ii(r,i=md5ii(i,m=md5ii(m,f,r,i,d[n+4],6,-145523070),f,r,d[n+11],10,-1120210379),m,f,d[n+2],15,718787259),i,m,d[n+9],21,-343485551),m=safe_add(m,h),f=safe_add(f,t),r=safe_add(r,g),i=safe_add(i,e)}return[m,f,r,i]}function md5cmn(d,_,m,f,r,i){return safe_add(bit_rol(safe_add(safe_add(_,d),safe_add(f,i)),r),m)}function md5ff(d,_,m,f,r,i,n){return md5cmn(_&m|~_&f,d,_,r,i,n)}function md5gg(d,_,m,f,r,i,n){return md5cmn(_&f|m&~f,d,_,r,i,n)}function md5hh(d,_,m,f,r,i,n){return md5cmn(_^m^f,d,_,r,i,n)}function md5ii(d,_,m,f,r,i,n){return md5cmn(m^(_|~f),d,_,r,i,n)}function safe_add(d,_){var m=(65535&d)+(65535&_);return(d>>16)+(_>>16)+(m>>16)<<16|65535&m}function bit_rol(d,_){return d<<_|d>>>32-_}

        loadPosts();
    </script>

</body>

</html>
