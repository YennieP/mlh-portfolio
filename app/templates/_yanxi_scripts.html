<!-- Shared end-of-body scripts for Yanxi's Forty-themed pages:
     Forty's bundled JS + the email-popup logic + modal handling.
     (The chatbot is only on the home page, loaded there via its own include.) -->
<script src="{{ url_for('static', filename='forty/js/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='forty/js/jquery.scrolly.min.js') }}"></script>
<script src="{{ url_for('static', filename='forty/js/jquery.scrollex.min.js') }}"></script>
<script src="{{ url_for('static', filename='forty/js/browser.min.js') }}"></script>
<script src="{{ url_for('static', filename='forty/js/breakpoints.min.js') }}"></script>
<script src="{{ url_for('static', filename='forty/js/util.js') }}"></script>
<script src="{{ url_for('static', filename='forty/js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/copy-email.js') }}"></script>

<!-- Fixes for Forty's page-transition fade (see comments). Must run after main.js. -->
<script>
    (function () {
        var $ = window.jQuery;

        /* Fix A — "blank page after Back".
           Forty fades #wrapper out (adds .is-transitioning) before navigating, and only
           clears body.is-preload on the 'load' event. A bfcache restore (Back button)
           skips 'load' and can keep #wrapper faded out (opacity:0) → the page looks empty.
           Clear both states every time the page is shown. */
        window.addEventListener("pageshow", function () {
            document.body.classList.remove("is-preload");
            var w = document.getElementById("wrapper");
            if (w) w.classList.remove("is-transitioning");
        });

        /* Fix B — links to an in-page modal (#modal-*) open a popup instead of
           navigating. Covers the About / Work / Education tiles (Forty clones each
           tile link into a .primary overlay — both carry the href, so we re-bind
           both) and the banner "Learn more" button. Tiles pointing to real pages
           (Hobbies / Places / Timeline) keep Forty's fade-and-navigate transition. */
        function yxOpenModal(id) {
            var m = document.getElementById(id);
            if (!m) return;
            m.classList.add("is-open");
            document.body.classList.add("yx-modal-lock"); // freeze the page behind it
            // the chat popup greets + focuses its input when opened
            if (id === "modal-chat" && window.yanxiChatActivate) window.yanxiChatActivate();
        }
        function yxCloseModal(m) {
            m.classList.remove("is-open");
            if (!document.querySelector(".yx-modal.is-open")) {
                document.body.classList.remove("yx-modal-lock");
            }
        }
        if ($) {
            $('a[href^="#modal-"]').off("click").on("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                yxOpenModal($(this).attr("href").slice(1));
            });
            $(".yx-modal").each(function () {
                var m = this;
                // click on the dark backdrop (not the card) closes it
                m.addEventListener("click", function (e) { if (e.target === m) yxCloseModal(m); });
                var btn = m.querySelector(".yx-modal-close");
                if (btn) btn.addEventListener("click", function () { yxCloseModal(m); });
            });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") {
                    var open = document.querySelectorAll(".yx-modal.is-open");
                    for (var i = 0; i < open.length; i++) yxCloseModal(open[i]);
                }
            });
        }
    })();
</script>
